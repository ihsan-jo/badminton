<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badminton Tournament</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="shuttlecock-black.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f8; --card: #ffffff; --text: #1b2430; --muted: #6b7684;
    --line: #e2e6ea; --accent: #2f5fb3; --accent-soft: #e8eefa; --win: #0a7d4f;
    --gold: #c99a06; --silver: #8a96a3; --bronze: #b4693a;
    --err-bg: #fde8e6; --err-text: #8a1c12;
    /* Hero is a court-green band in both themes; text on it uses --on-hero */
    --hero-1: #0d5c46; --hero-2: #0b3b4f; --on-hero: #f2fbf6; --hero-line: rgba(255, 255, 255, .14);
    --shadow: 0 1px 2px rgba(16, 32, 48, .06), 0 6px 18px rgba(16, 32, 48, .08);
    --shadow-lift: 0 4px 10px rgba(16, 32, 48, .10), 0 16px 34px rgba(16, 32, 48, .14);
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #11161c; --card: #1a2129; --text: #e8edf2; --muted: #93a0ae;
      --line: #2a333d; --accent: #7fa6ff; --accent-soft: #1f2a3d; --win: #3ccf8e;
      --gold: #f2c94c; --silver: #b8c2cc; --bronze: #e0915f;
      --err-bg: #3a1d1b; --err-text: #ffb4ab;
      --hero-1: #0a4a39; --hero-2: #0a2433; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
      --shadow-lift: 0 6px 14px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #11161c; --card: #1a2129; --text: #e8edf2; --muted: #93a0ae;
    --line: #2a333d; --accent: #7fa6ff; --accent-soft: #1f2a3d; --win: #3ccf8e;
    --gold: #f2c94c; --silver: #b8c2cc; --bronze: #e0915f;
    --err-bg: #3a1d1b; --err-text: #ffb4ab;
    --hero-1: #0a4a39; --hero-2: #0a2433; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    --shadow-lift: 0 6px 14px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hero { position: relative; overflow: hidden; color: var(--on-hero);
          background: radial-gradient(120% 140% at 85% 0%, var(--hero-1), var(--hero-2) 70%); }
  /* Court markings drawn with gradients: outer box, centre line, service lines */
  .hero .court { position: absolute; inset: -10% -5%; pointer-events: none; opacity: .9;
    background:
      linear-gradient(var(--hero-line), var(--hero-line)) 50% 0 / 2px 100% no-repeat,
      linear-gradient(90deg, var(--hero-line), var(--hero-line)) 0 30% / 100% 2px no-repeat,
      linear-gradient(90deg, var(--hero-line), var(--hero-line)) 0 70% / 100% 2px no-repeat;
    border: 2px solid var(--hero-line); border-radius: 4px; transform: perspective(700px) rotateX(38deg); }
  .hero .para { position: absolute; color: var(--on-hero); pointer-events: none; will-change: transform; }
  .hero .para .ic { width: 100%; height: 100%; animation: bob 6s ease-in-out infinite; }
  .p2 .ic { animation-duration: 4.5s !important; animation-delay: -1s; } .p3 .ic { animation-duration: 7.5s !important; animation-delay: -3s; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(8deg); } }
  .p1 { width: 120px; height: 120px; right: 6%; top: 18px; opacity: .22; }
  .p2 { width: 54px; height: 54px; right: 34%; top: 92px; opacity: .16; }
  .p3 { width: 80px; height: 80px; left: 52%; bottom: -18px; opacity: .12; }
  .hero-in { position: relative; max-width: 960px; margin: 0 auto;
             padding-block: 22px 26px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; align-items: center; gap: 12px; }
  header .text { flex: 1; min-width: 0; }
  h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 6vw, 2.9rem);
       line-height: .95; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
  .hero .sub { color: var(--on-hero); opacity: .78; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .stat { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .16); border-radius: 12px;
          padding: 8px 12px; min-width: 0; backdrop-filter: blur(6px); }
  .stat b { display: block; white-space: nowrap; font-family: var(--display); font-size: 1.5rem; line-height: 1.15; padding-bottom: 2px; font-variant-numeric: tabular-nums; }
  .stat > span { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
  .progress { margin-top: 14px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; border-radius: inherit;
                background: linear-gradient(90deg, #7ee2b0, #f2c94c); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
  .ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: rgba(255, 255, 255, .14); color: var(--on-hero);
          display: grid; place-items: center; font-size: 34px; flex: none; }
  .theme-btn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .1);
               color: var(--on-hero); display: grid; place-items: center; font-size: 20px; cursor: pointer; flex: none; }
  .theme-btn:hover { background: rgba(255, 255, 255, .2); }
  .theme-btn .sun { display: none; }
  :root[data-theme="dark"] .theme-btn .sun { display: block; }
  :root[data-theme="dark"] .theme-btn .moon { display: none; }
  h2 .ic { color: var(--accent); margin-right: 6px; }
  h3 .ic { margin-right: 4px; font-size: 1.1em; }
  h3.final { color: var(--gold); } h3.third { color: var(--bronze); }
  nav a .ic { margin-right: 4px; }
  .rk { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; font-weight: 700; font-size: .8rem; }
  .rk1 { background: var(--gold); color: #1b1300; } .rk2 { background: var(--silver); color: #10161c; } .rk3 { background: var(--bronze); color: #1d0d03; }
  .row .win-ic { color: var(--win); font-size: .95em; }
  .sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(10px); border-bottom: 1px solid transparent; transition: box-shadow .25s, border-color .25s; }
  nav.scrolled { border-color: var(--line); box-shadow: var(--shadow); }
  nav div { max-width: 960px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; overflow-x: auto; }
  nav a { transition: background .2s, transform .2s; color: var(--accent); text-decoration: none; font-weight: 600; font-size: .9rem;
          padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); white-space: nowrap; }
  main { max-width: 960px; margin: 0 auto; padding-block: 0 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: .02em; text-transform: uppercase; margin: 32px 0 12px; scroll-margin-top: 64px; display: flex; align-items: center; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 8px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .scroll table { min-width: 560px; }
  /* Keep rank and team name in view while the numbers scroll sideways */
  .scroll th:nth-child(1), .scroll td:nth-child(1) { position: sticky; left: 0; width: 32px; min-width: 32px; background: var(--card); }
  .scroll th:nth-child(2), .scroll td:nth-child(2) { position: sticky; left: 32px; background: var(--card); box-shadow: 1px 0 0 var(--line); white-space: nowrap; }
  .hint { display: none; color: var(--muted); font-size: .78rem; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); font-size: .92rem; }
  th { font-size: .75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  tr:last-child td { border-bottom: 0; }
  td.team, th.team { text-align: left; }
  td.team { font-weight: 500; }
  td.pts { font-family: var(--display); font-weight: 700; font-size: 1.2rem; }
  /* Leader row: soft gold sweep */
  /* Leader row: warm gold tint, including the pinned rank and team cells */
  .scroll tr.leader td { background: color-mix(in srgb, var(--gold) 12%, var(--card)); }
  tr.qual td:first-child { box-shadow: inset 3px 0 0 var(--win); }
  .note { color: var(--muted); font-size: .8rem; margin-top: 8px; line-height: 1.5; }
  @media (max-width: 600px) { .hint { display: block; } th, td { padding: 8px 6px; font-size: .85rem; } }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); }
  .match { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
           transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s; transform-style: preserve-3d; }
  @media (hover: hover) and (pointer: fine) { .match:hover { box-shadow: var(--shadow-lift); } }
  .match.done { border-color: color-mix(in srgb, var(--win) 35%, var(--line)); }
  .g { font-family: var(--display); font-size: 1.15rem; }
  /* Entrance: elements are visible at rest; .rise replays a short lift when they scroll into view */
  .rise { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0s); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
  /* Floating button with scroll-progress ring and quick menu */
  .fab { position: fixed; z-index: 20; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
         display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .fab-btn { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer;
             background: linear-gradient(145deg, var(--hero-1), var(--hero-2)); color: var(--on-hero); font-size: 26px;
             display: grid; place-items: center; box-shadow: var(--shadow-lift); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  .fab-btn:hover { transform: scale(1.06); }
  .fab.open .fab-btn .ic { transform: rotate(-35deg); }
  .fab-btn .ic { transition: transform .3s; }
  .fab-ring { position: absolute; inset: -4px; width: 66px; height: 66px; transform: rotate(-90deg); pointer-events: none; }
  .fab-ring circle { fill: none; stroke-width: 3; }
  .fab-ring .track { stroke: color-mix(in srgb, var(--text) 12%, transparent); }
  .fab-ring .bar { stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 195; stroke-dashoffset: 195; }
  .fab-menu { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .fab-menu a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; text-decoration: none;
                background: var(--card); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 600; font-size: .9rem;
                opacity: 0; transform: translateY(12px) scale(.9); pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2, .8, .2, 1); }
  .fab-menu a .ic { color: var(--accent); }
  .fab.open .fab-menu a { opacity: 1; transform: none; pointer-events: auto; }
  .fab.open .fab-menu a:nth-child(1) { transition-delay: .09s; } .fab.open .fab-menu a:nth-child(2) { transition-delay: .06s; }
  .fab.open .fab-menu a:nth-child(3) { transition-delay: .03s; }
  .toast { position: fixed; z-index: 30; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px);
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem;
           opacity: 0; transition: opacity .25s, transform .3s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #confetti { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hero .para { transform: none !important; }
  }
  .meta { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .name.tbd { color: var(--muted); font-style: italic; }
  .row.winner .name { color: var(--win); font-weight: 700; }
  .g { width: 28px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  .g.won { color: var(--text); font-weight: 700; }
  .filter { margin: 0 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); max-width: 100%; }
  .edit-btn { margin-top: 8px; width: 100%; padding: 7px; border-radius: 8px; border: 1px dashed var(--line);
              background: transparent; color: var(--accent); font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; }
  .edit-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text);
           padding: 18px; width: min(380px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h3 { margin: 0 0 12px; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 1rem; }
  .sc { display: grid; grid-template-columns: 1fr 56px 56px 56px; gap: 8px; align-items: center; font-size: .9rem; }
  .sc .hd { color: var(--muted); font-size: .75rem; text-align: center; }
  .sc .tm { overflow-wrap: anywhere; font-weight: 500; }
  .sc input { width: 100%; padding: 8px 4px; text-align: center; font: inherit; border-radius: 8px;
              border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .dlg-msg { min-height: 1.2em; font-size: .82rem; color: var(--err-text); margin: 10px 0 0; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .dlg-btns button { padding: 8px 16px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
                     border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .dlg-btns .primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .dlg-btns button:disabled { opacity: .6; cursor: default; }
  .error { background: var(--err-bg); color: var(--err-text); padding: 10px 14px; border-radius: 8px; margin-top: 16px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-shuttle" viewBox="0 0 64 64">
    <g fill="currentColor" stroke="none"><g transform="translate(32 32) scale(1.1233) translate(-36.127 -27.873) rotate(45 32 32)"><path d="M23.50 40.00L11.38 10.01A5.85 5.85 0 0 1 20.71 7.17L27.10 40.00L23.50 40.00ZM28.73 40.00L22.28 6.86A5.37 5.37 0 0 1 31.20 6.01L31.20 40.00L28.73 40.00ZM32.80 40.00L32.80 6.01A5.37 5.37 0 0 1 41.72 6.86L35.27 40.00L32.80 40.00ZM36.90 40.00L43.29 7.17A5.85 5.85 0 0 1 52.62 10.01L40.50 40.00L36.90 40.00Z"/><rect x="22.30" y="41.40" width="19.40" height="4.2" rx="1.3"/><path d="M21.30 47.00H42.70V48.80A10.70 10.70 0 0 1 21.30 48.80Z"/></g></g>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-8"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
  <symbol id="i-medal" viewBox="0 0 24 24"><circle cx="12" cy="15" r="6"/><path d="M8.2 10.3 5 3h4l3 6.5L15 3h4l-3.2 7.3"/></symbol>
  <symbol id="i-bracket" viewBox="0 0 24 24"><path d="M3 5h6v14H3M9 12h6M15 7h6M15 17h6M15 7v10"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>

</svg>
<section class="hero">
  <div class="court" aria-hidden="true"></div>
  <div class="para p1" data-speed=".35" aria-hidden="true"><svg class="ic"><use href="#i-shuttle"/></svg></div>
  <div class="para p2" data-speed=".6" aria-hidden="true"><svg class="ic"><use href="#i-shuttle"/></svg></div>
  <div class="para p3" data-speed=".18" aria-hidden="true"><svg class="ic"><use href="#i-shuttle"/></svg></div>
  <div class="hero-in">
    <header>
      <div class="logo"><svg class="ic"><use href="#i-shuttle"/></svg></div>
      <div class="text">
        <h1 id="title">Badminton Tournament</h1>
        <div class="sub" id="status">Loading…</div>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch dark or light mode" title="Switch dark or light mode">
        <svg class="ic moon"><use href="#i-moon"/></svg><svg class="ic sun"><use href="#i-sun"/></svg>
      </button>
    </header>
    <div class="stats">
      <div class="stat"><b><span class="count" id="stPlayed">0</span>/<span id="stTotal">0</span></b><span>Played</span></div>
      <div class="stat"><b id="stLeader">–</b><span>Leader</span></div>
      <div class="stat"><b><span class="count" id="stTeams">0</span></b><span>Teams</span></div>
    </div>
    <div class="progress" aria-hidden="true"><i id="stBar"></i></div>
  </div>
</section>
<nav id="nav"><div>
  <a href="#standings"><svg class="ic"><use href="#i-chart"/></svg>Standings</a><a href="#knockout"><svg class="ic"><use href="#i-trophy"/></svg>Knockout</a><a href="#matches"><svg class="ic"><use href="#i-calendar"/></svg>Group matches</a>
</div></nav>
<main>
  <div id="err"></div>
  <h2 id="standings"><svg class="ic"><use href="#i-chart"/></svg>Standings</h2>
  <div class="box scroll"><table>
    <thead><tr><th>#</th><th class="team">Team</th><th>Play</th><th>Win</th><th>Loss</th>
      <th>Game Diff</th><th>Score Diff</th><th>Point</th></tr></thead>
    <tbody id="table"></tbody>
  </table></div>
  <div class="hint">Swipe the table sideways to see all columns.</div>
  <div class="note" id="criteria"></div>

  <h2 id="knockout"><svg class="ic"><use href="#i-trophy"/></svg>Knockout</h2>
  <div id="ko"></div>

  <h2 id="matches"><svg class="ic"><use href="#i-calendar"/></svg>Group matches</h2>
  <div class="filter"><label for="teamFilter">Show team:</label>
    <select id="teamFilter"><option value="">All teams</option></select></div>
  <div class="grid" id="group"></div>

<dialog id="scoreDlg">

<script>
// ===== SETTINGS =====
const TOURNAMENT_NAME = "Badminton Tournament";
// Supabase database that holds the matches. Leave SUPABASE_URL empty to see demo data.
// The publishable key is meant to be public; the database only lets visitors read matches and change scores.
const SUPABASE_URL = "https://lvfgvvegnqysiaipyhss.supabase.co";
const SUPABASE_KEY = "sb_publishable_RYprJxyk2fDkVVD-QLYY7w_MAKox9A2";
const POINTS_FOR_WIN = 1;     // points a team gets for winning a match
const POINTS_FOR_LOSS = 0;
const TOP_N_QUALIFY = 4;      // how many teams go to the semifinals
const CAN_EDIT = true;        // show Enter/Edit score buttons on match cards
// ====================

const DEMO_CSV = `No,Stage,Team A,Team B,G1 A,G1 B,G2 A,G2 B,G3 A,G3 B
1,Group,Harry - Syahrul,Apraz - Afif,21,13,30,28,,
2,Group,Andy - Ahmad,Amang - Defri,30,28,21,9,,
3,Group,Ikhfi - Dito,Bayu - Novan,21,9,23,25,17,21
4,Group,Cholis - Faisal,Arkan - Randhy,25,23,21,10,,
5,Group,Andy - Ahmad,Harry - Syahrul,9,21,25,23,16,21
6,Group,Apraz - Afif,Bayu - Novan,17,21,21,14,21,15
7,Group,Cholis - Faisal,Amang - Defri,21,10,21,17,,
8,Group,Ikhfi - Dito,Arkan - Randhy,21,13,28,26,,
9,Group,Harry - Syahrul,Bayu - Novan,29,27,28,30,21,13
10,Group,Cholis - Faisal,Andy - Ahmad,21,15,21,9,,
11,Group,Apraz - Afif,Arkan - Randhy,24,26,21,18,21,14

13,Group,Cholis - Faisal,Harry - Syahrul,29,27,12,21,21,16
14,Group,Bayu - Novan,Arkan - Randhy,21,13,24,22,,
15,Group,Ikhfi - Dito,Andy - Ahmad,21,18,26,24,,
16,Group,Apraz - Afif,Amang - Defri,14,21,13,21,,
17,Group,Harry - Syahrul,Arkan - Randhy,16,21,30,28,21,14
18,Group,Ikhfi - Dito,Cholis - Faisal,21,23,25,27,,
19,Group,Bayu - Novan,Amang - Defri,22,24,21,13,21,11
20,Group,Apraz - Afif,Andy - Ahmad,12,21,27,29,,
21,Group,Ikhfi - Dito,Harry - Syahrul,21,15,25,27,21,15
22,Group,Arkan - Randhy,Amang - Defri,8,21,28,30,,
23,Group,Apraz - Afif,Cholis - Faisal,16,21,21,9,21,13
24,Group,Bayu - Novan,Andy - Ahmad,11,21,13,21,,
25,Group,Harry - Syahrul,Amang - Defri,11,21,21,19,21,15
26,Group,Apraz - Afif,Ikhfi - Dito,21,8,11,21,15,21
27,Group,Arkan - Randhy,Andy - Ahmad,21,13,29,27,,
28,Group,Bayu - Novan,Cholis - Faisal,11,21,21,17,18,21
1,Semifinal,Rank 1,Rank 4,26,28,21,11,18,21
2,Semifinal,Rank 2,Rank 3,21,19,21,9,,
3,3rd Place,SF 1 Loser,SF 2 Loser,,,,,,
4,Final,SF 1 Winner,SF 2 Winner,,,,,,`;

function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r =>
    Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Turn a sheet row into a match with its games and result.
function toMatch(r) {
  const games = [1, 2, 3]
    .map(n => [r[`G${n} A`], r[`G${n} B`]])
    .filter(([a, b]) => a !== "" && b !== "" && !isNaN(a) && !isNaN(b))
    .map(([a, b]) => [Number(a), Number(b)]);
  const gA = games.filter(([a, b]) => a > b).length;
  const gB = games.filter(([a, b]) => b > a).length;
  const done = gA === 2 || gB === 2;
  return { row: r, no: r.No, stage: (r.Stage || "Group").trim(), a: r["Team A"], b: r["Team B"],
           games, gA, gB, done, winner: done ? (gA > gB ? "a" : "b") : null };
}

function standings(group) {
  const teams = {};
  const t = name => teams[name] ??= { name, play: 0, win: 0, loss: 0, gf: 0, ga: 0, sf: 0, sa: 0, pts: 0 };
  group.forEach(m => { t(m.a); t(m.b); });
  group.filter(m => m.done).forEach(m => {
    const A = t(m.a), B = t(m.b);
    A.play++; B.play++;
    A.gf += m.gA; A.ga += m.gB; B.gf += m.gB; B.ga += m.gA;
    m.games.forEach(([x, y]) => { A.sf += x; A.sa += y; B.sf += y; B.sa += x; });
    const [W, L] = m.winner === "a" ? [A, B] : [B, A];
    W.win++; L.loss++; W.pts += POINTS_FOR_WIN; L.pts += POINTS_FOR_LOSS;
  });
  const list = Object.values(teams);
  list.forEach(x => { x.gd = x.gf - x.ga; x.sd = x.sf - x.sa; });

  // Rank by points; break ties by head-to-head among the tied teams, then game diff, then score diff.
  list.sort((x, y) => y.pts - x.pts);
  const out = [];
  for (let i = 0; i < list.length;) {
    let j = i; while (j < list.length && list[j].pts === list[i].pts) j++;
    const tied = list.slice(i, j), names = new Set(tied.map(x => x.name));
    const h2h = Object.fromEntries(tied.map(x => [x.name, 0]));
    group.filter(m => m.done && names.has(m.a) && names.has(m.b))
         .forEach(m => h2h[m.winner === "a" ? m.a : m.b]++);
    tied.sort((x, y) => h2h[y.name] - h2h[x.name] || y.gd - x.gd || y.sd - x.sd);
    out.push(...tied); i = j;
  }
  return out;
}

function matchCard(m, label) {
  const row = side => {
    const name = side === "a" ? m.a : m.b, known = !m[side + "Tbd"];
    const cells = m.games.map(([a, b]) => {
      const mine = side === "a" ? a : b, theirs = side === "a" ? b : a;
      return `<span class="g ${mine > theirs ? "won" : ""}">${mine}</span>`;
    }).join("");
    return `<div class="row ${m.winner === side ? "winner" : ""}">
      <span class="name ${known ? "" : "tbd"}">${esc(name || "TBD")}${m.winner === side ? ' <svg class="ic win-ic"><use href="#i-check"/></svg>' : ""}</span>${cells}</div>`;
  };
  return `<div class="match ${m.done ? "done" : ""}"><div class="meta"><span>${esc(label)}</span>
    <span>${m.done ? "Final" : m.games.length ? "In progress" : "Not played"}</span></div>
    ${row("a")}${row("b")}${CAN_EDIT && !m.aTbd && !m.bTbd
      ? `<button class="edit-btn" type="button" data-stage="${esc(m.stage)}" data-no="${esc(m.no)}">${m.games.length ? "Edit score" : "Enter score"}</button>` : ""}</div>`;
}

let currentRows = [], shownMatches = [];

function render(rows) {
  currentRows = rows;
  const all = rows.map(toMatch);
  shownMatches = all;
  const group = all.filter(m => m.stage.toLowerCase() === "group");
  const ko = all.filter(m => m.stage.toLowerCase() !== "group");
  const table = standings(group);
  const groupDone = group.length > 0 && group.every(m => m.done);
  const played = group.filter(m => m.done).length;

  document.getElementById("table").innerHTML = table.map((x, i) => `
    <tr class="${groupDone && i < TOP_N_QUALIFY ? "qual" : ""} ${played && i === 0 ? "leader" : ""}"><td>${played && i < 3 ? `<span class="rk rk${i + 1}">${i + 1}</span>` : i + 1}</td><td class="team">${esc(x.name)}</td>
    <td>${x.play}</td><td>${x.win}</td><td>${x.loss}</td>
    <td>${x.gd > 0 ? "+" : ""}${x.gd}</td><td>${x.sd > 0 ? "+" : ""}${x.sd}</td>
    <td class="pts"><span class="count">${x.pts}</span></td></tr>`).join("");
  // Hero stats
  document.getElementById("stPlayed").textContent = played;
  document.getElementById("stTotal").textContent = group.length;
  document.getElementById("stTeams").textContent = table.length;
  document.getElementById("stLeader").textContent = played ? table[0].name : "–";
  requestAnimationFrame(() => document.getElementById("stBar").style.width = (group.length ? played / group.length * 100 : 0) + "%");
  document.getElementById("criteria").textContent =
    `${played} of ${group.length} group matches played. Ranking: points (win = ${POINTS_FOR_WIN}), then head-to-head, game difference, score difference. Top ${TOP_N_QUALIFY} go to the semifinals.`;

  // Fill in knockout placeholders such as "Rank 1" or "SF 1 Winner" once they are decided.
  const semis = ko.filter(m => m.stage.toLowerCase() === "semifinal");
  const resolve = (m, side) => {
    const raw = m[side];
    let r = raw.match(/^rank\s*(\d+)$/i);
    if (r) { if (groupDone && table[r[1] - 1]) return table[r[1] - 1].name; m[side + "Tbd"] = true; return raw; }
    r = raw.match(/^sf\s*(\d+)\s*(winner|loser)$/i);
    if (r) {
      const sf = semis[r[1] - 1];
      if (sf && sf.done) {
        const win = r[2].toLowerCase() === "winner";
        return (sf.winner === "a") === win ? sf.a : sf.b;
      }
      m[side + "Tbd"] = true; return raw;
    }
    return raw;
  };
  ko.forEach(m => { m.a = resolve(m, "a"); m.b = resolve(m, "b"); });

  const stages = [...new Set(ko.map(m => m.stage))];
  document.getElementById("ko").innerHTML = stages.map(s => {
    const ms = ko.filter(m => m.stage === s);
    const key = s.toLowerCase();
    const icon = key === "final" ? "trophy" : key.startsWith("3") ? "medal" : "bracket";
    const cls = key === "final" ? "final" : key.startsWith("3") ? "third" : "";
    return `<h3 class="${cls}"><svg class="ic"><use href="#i-${icon}"/></svg>${esc(s)}</h3><div class="grid">${ms.map(m =>
      matchCard(m, ms.length > 1 ? `${s} ${m.no}` : s)).join("")}</div>`;
  }).join("") || '<div class="note">No knockout matches in the sheet.</div>';

  const sel = document.getElementById("teamFilter");
  if (sel.options.length === 1)
    table.map(x => x.name).sort().forEach(n => sel.add(new Option(n, n)));
  const drawGroup = () => {
    const f = sel.value;
    document.getElementById("group").innerHTML = group
      .filter(m => !f || m.a === f || m.b === f)
      // Played (or started) matches first, then the rest; each part keeps match-number order.
      .sort((x, y) => (y.games.length > 0) - (x.games.length > 0))
      .map(m => matchCard(m, `Match ${m.no}`)).join("");
  };
  sel.onchange = () => { drawGroup(); animateIn(document.querySelectorAll("#group .match")); };
  drawGroup();
}

// Database columns -> the column names the rest of the page uses (same as the old sheet).
const DB_COLS = { no: "No", stage: "Stage", team_a: "Team A", team_b: "Team B",
  g1_a: "G1 A", g1_b: "G1 B", g2_a: "G2 A", g2_b: "G2 B", g3_a: "G3 A", g3_b: "G3 B" };

async function db(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts,
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(`Database error ${res.status}: ${(await res.text()).slice(0, 200)}`);
  return res.status === 204 ? null : res.json();
}

async function readMatches() {
  const rows = await db(`matches?select=${Object.keys(DB_COLS).join(",")}&order=sort`);
  return rows.map(r => Object.fromEntries(Object.entries(DB_COLS).map(([k, label]) => [label, r[k] == null ? "" : String(r[k])])));
}

// ----- Score entry -----
const dlg = document.getElementById("scoreDlg"), form = document.getElementById("scoreForm");
const dlgMsg = document.getElementById("dlgMsg"), saveBtn = document.getElementById("dlgSave");
const SCORE_KEYS = ["G1 A", "G1 B", "G2 A", "G2 B", "G3 A", "G3 B"];
let editing = null;

document.addEventListener("click", e => {
  const btn = e.target.closest(".edit-btn");
  if (!btn) return;
  const m = shownMatches.find(x => x.stage === btn.dataset.stage && String(x.no) === btn.dataset.no);
  if (!m) return;
  editing = m;
  document.getElementById("dlgTitle").textContent = `${m.stage === "Group" ? "Match" : m.stage} ${m.no}`;
  document.getElementById("dlgA").textContent = m.a;
  document.getElementById("dlgB").textContent = m.b;
  SCORE_KEYS.forEach((k, i) => form.elements["s" + i].value = m.row[k] || "");
  dlgMsg.textContent = ""; saveBtn.disabled = false; saveBtn.textContent = "Save";
  dlg.showModal();
});
document.getElementById("dlgCancel").onclick = () => dlg.close();

form.addEventListener("submit", async e => {
  e.preventDefault();
  const scores = SCORE_KEYS.map((k, i) => form.elements["s" + i].value.trim());
  for (let g = 0; g < 3; g++) {
    const [a, b] = [scores[g * 2], scores[g * 2 + 1]];
    if ((a === "") !== (b === "")) { dlgMsg.textContent = `Game ${g + 1} needs a score for both teams.`; return; }
    if ([a, b].some(v => v !== "" && !/^\d{1,2}$/.test(v))) { dlgMsg.textContent = "Scores must be whole numbers."; return; }
  }
  saveBtn.disabled = true; saveBtn.textContent = "Saving…"; dlgMsg.textContent = "";
  try {
    const body = Object.fromEntries(["g1_a", "g1_b", "g2_a", "g2_b", "g3_a", "g3_b"]
      .map((k, i) => [k, scores[i] === "" ? null : Number(scores[i])]));
    const saved = !SUPABASE_URL ? [{}] : await db(`matches?stage=eq.${encodeURIComponent(editing.stage)}&no=eq.${encodeURIComponent(editing.no)}`,
      { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(body) });
    if (!saved || !saved.length) throw new Error("match not found in the database");
    const wasDone = editing.done;
    SCORE_KEYS.forEach((k, i) => editing.row[k] = scores[i]);
    dlg.close();
    render(currentRows);
    animateIn(document.querySelectorAll(".match"), true);
    const now = toMatch(editing.row);
    toast(now.done && !wasDone ? `${now.winner === "a" ? editing.a : editing.b} wins!` : "Score saved");
    if (now.done && !wasDone) confetti();
  } catch (err) {
    dlgMsg.textContent = "Couldn't save: " + err.message;
    saveBtn.disabled = false; saveBtn.textContent = "Save";
  }
});

// ----- Effects -----
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Count numbers up from 0 the first time they appear.
function countUp(root = document) {
  if (reduceMotion) return;
  root.querySelectorAll(".count").forEach(el => {
    const end = Number(el.textContent); if (!end) return;
    const t0 = performance.now(), dur = 900;
    const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
                        if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// Replay a short lift on cards and rows as they scroll into view. They stay visible without it.
const seen = new WeakSet();
const io = "IntersectionObserver" in window && !reduceMotion ? new IntersectionObserver(entries => {
  entries.forEach(en => {
    const el = en.target;
    if (!en.isIntersecting) { el.classList.remove("rise"); return; }   // reset so it replays next time
    if (el.dataset.quiet) { delete el.dataset.quiet; return; }           // already on screen after a save
    void el.offsetWidth; el.classList.add("rise");
  });
}, { rootMargin: "0px 0px -8% 0px" }) : null;
function animateIn(els, quiet = false) {
  if (!io) return;
  [...els].forEach((el, i) => { if (seen.has(el)) return; seen.add(el);
    if (quiet) el.dataset.quiet = 1; el.style.setProperty("--d", (i % 6) * 0.05 + "s"); io.observe(el); });
}

// Parallax shuttlecocks, sticky-nav shadow and the FAB progress ring, all from one scroll handler.
const paras = [...document.querySelectorAll(".para")], nav = document.getElementById("nav"), fabBar = document.getElementById("fabBar");
let ticking = false;
function onScroll() {
  const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
  if (!reduceMotion) paras.forEach(p => p.style.transform = `translate3d(0, ${y * p.dataset.speed}px, 0) rotate(${y * p.dataset.speed * 0.15}deg)`);
  nav.classList.toggle("scrolled", y > 140);
  fabBar.style.strokeDashoffset = 195 * (1 - (max > 0 ? Math.min(1, y / max) : 0));
  ticking = false;
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

// Gentle 3D tilt on match cards for mouse users.
if (!reduceMotion && matchMedia("(hover: hover) and (pointer: fine)").matches) {
  document.addEventListener("pointermove", e => {
    const c = e.target.closest(".match"); if (!c) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    c.style.transform = `perspective(700px) rotateX(${-y * 5}deg) rotateY(${x * 6}deg) translateY(-3px)`;
  });
  document.addEventListener("pointerout", e => { const c = e.target.closest(".match"); if (c && !c.contains(e.relatedTarget)) c.style.transform = ""; });
}

// Floating button opens the quick menu.
const fab = document.getElementById("fab"), fabBtn = document.getElementById("fabBtn");
fabBtn.onclick = () => { const open = fab.classList.toggle("open"); fabBtn.setAttribute("aria-expanded", open); };
document.getElementById("fabMenu").addEventListener("click", () => { fab.classList.remove("open"); fabBtn.setAttribute("aria-expanded", false); });
document.addEventListener("click", e => { if (!fab.contains(e.target)) fab.classList.remove("open"); });

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200);
}

// Confetti burst in court colours when a match is decided.
function confetti() {
  if (reduceMotion) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ["#f2c94c", "#7ee2b0", "#7fa6ff", "#ffffff", "#e0915f"];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * .45, vx: (Math.random() - .5) * 14,
    vy: -Math.random() * 13 - 4, r: Math.random() * 6 + 3, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6, s: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

async function load() {
  try {
    render(SUPABASE_URL ? await readMatches() : parseCSV(DEMO_CSV));
    countUp();
    animateIn(document.querySelectorAll(".match"));
    onScroll();
    document.getElementById("status").textContent =
      (SUPABASE_URL ? "" : "Demo data · ") + "Loaded " + new Date().toLocaleString() + " · reload the page for the latest scores";
  } catch (e) {
    document.getElementById("err").innerHTML =
      `<div class="error">Couldn't load the scores: ${esc(e.message)}. If the database was paused after a quiet week, restore it from the Supabase dashboard.</div>`;
  }
}

// Dark / light toggle. Starts from the phone's own setting; the choice is remembered on this device.
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};
if (!document.documentElement.dataset.theme)
  document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

document.getElementById("title").textContent = TOURNAMENT_NAME;
document.title = TOURNAMENT_NAME;
load();
</script>
